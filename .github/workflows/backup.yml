name: Database Backup

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Configure AWS CLI for Cloudflare R2
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.BACKUP_R2_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.BACKUP_R2_SECRET_ACCESS_KEY }}
          aws-region: auto

      - name: Create compressed database backup
        run: |
          mkdir -p backups
          pg_dump "${{ secrets.DATABASE_URL }}" | gzip > backups/db-backup-$(date -u +%Y-%m-%d-%H-%M-%S).sql.gz

      - name: Upload backup to Cloudflare R2
        run: |
          aws s3 cp backups/*.sql.gz s3://${{ secrets.BACKUP_R2_BUCKET }}/ \
            --endpoint-url "${{ secrets.BACKUP_R2_ENDPOINT }}"
